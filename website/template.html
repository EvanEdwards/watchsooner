<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@@TITLE@@ — @@DESCRIPTION@@</title>
<meta name="description" content="@@DESCRIPTION@@">
<link rel="icon" type="image/svg+xml" href="@@FAVICON@@">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&amp;family=Roboto:wght@400;500&amp;family=Literata:opsz,wght@7..72,400..700&amp;display=swap">
<style>
@@CSS@@
html{color-scheme:dark}
html,body{margin:0}
body{background:var(--surface-100)}

.sd-footer__links{display:inline-flex;flex-wrap:wrap;gap:var(--space-6)}

/* Screenshot slideshow: the slides stack and cross-fade; the stage keeps the 16:10 frame. */
.sd-shot__stage{position:relative;aspect-ratio:16/10;background:var(--surface-300)}
.sd-shot__stage[role="button"]{cursor:zoom-in}
.sd-shot__stage:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.sd-shot__slide{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .6s ease}
.sd-shot__slide.is-active{opacity:1}
/* Progress line: fills left to right over one rotation, then resets with the next slide. */
.sd-shot__progress{position:absolute;left:0;bottom:0;z-index:1;width:100%;height:4px;background:#ff0033;transform:scaleX(0);transform-origin:left;pointer-events:none}

/* Full-screen view: any click closes it, as does the X button or Escape. */
.sd-lightbox{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:rgb(18 22 20 / 94%);cursor:zoom-out}
.sd-lightbox img{display:block;max-width:100vw;max-height:100vh;width:auto;height:auto;object-fit:contain}
.sd-lightbox__close{position:absolute;top:var(--space-4);right:var(--space-4);display:grid;place-items:center;width:44px;height:44px;padding:0;border:1px solid var(--border-strong);border-radius:var(--radius-pill);background:var(--surface-200);color:var(--ink);cursor:pointer;transition:background-color .15s,border-color .15s}
.sd-lightbox__close:hover{background:var(--surface-300);border-color:var(--sage-500)}
.sd-lightbox__close:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.sd-lightbox-open{overflow:hidden}
@media (prefers-reduced-motion:reduce){.sd-shot__slide,.sd-lightbox__close{transition:none}.sd-shot__progress{display:none}}
</style>
</head>
<body>
<div class="sd-page">
  <header class="sd-nav">
    <a class="sd-wordmark" href="#"><span class="sd-rose-tile"><span class="sd-rose" role="img" aria-label="Cheshire Hall rose"></span></span><span>Cheshire Hall<span class="sd-wordmark__dot">.</span></span></a>
    <span>
      <span class="sd-link caption">@@PRIVACY_LINK@@</span> &nbsp;
      <a class="sd-link caption" href="@@SOURCE_URL@@">Source</a> &nbsp;
      <a class="sd-link caption" href="@@CHANGELOG_URL@@">Changelog</a> &nbsp;
      <a class="sd-link caption" href="https://ko-fi.com/cheshirehall">Donate</a>
    </span>
  </header>
  <main>
    <section class="sd-hero">
      <div class="sd-hero__copy">
        <span class="sd-eyebrow label">Chrome extension</span>
        <h1 class="display">@@TITLE@@</h1>
        <p class="lede">@@DESCRIPTION@@</p>
        <div class="sd-hero__actions">
          <a class="sd-button sd-button--primary action" href="@@DOWNLOAD_URL@@">@@DOWNLOAD_ICON@@@@DOWNLOAD_LABEL@@</a>
          <a class="sd-button sd-button--secondary action" href="@@SOURCE_URL@@">View source</a>
        </div>
        <p class="sd-hero__meta caption">@@META@@</p>
      </div>
      <figure class="sd-shot">
        <div class="sd-shot__bar">
          <span class="sd-shot__dot"></span><span class="sd-shot__dot"></span><span class="sd-shot__dot"></span>
          <span class="sd-shot__title caption">youtube.com</span>
        </div>
        <div class="sd-shot__stage">
@@SCREENSHOT@@
        </div>
      </figure>
    </section>
    <section class="sd-band">
      <div class="sd-band__inner">
        <h2 class="h2">About</h2>
        <div class="sd-prose body">
@@ABOUT@@
        </div>
      </div>
    </section>
  </main>
  <footer class="sd-footer caption">
    <span>© 2026 @@AUTHOR@@</span>
    <span class="sd-footer__links">@@AUTHOR_LINK@@@@PRIVACY_LINK@@</span>
  </footer>
</div>
<script>
(function () {
  var stage = document.querySelector('.sd-shot__stage');
  if (!stage) return;
  var slides = Array.prototype.slice.call(stage.querySelectorAll('.sd-shot__slide'));
  if (!slides.length) return;

  var current = 0;
  var hovering = false;
  var lightbox = null;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  stage.setAttribute('role', 'button');
  stage.setAttribute('tabindex', '0');
  stage.setAttribute('aria-label', 'View screenshot full screen');

  function show(index) {
    slides[current].classList.remove('is-active');
    slides[current].setAttribute('aria-hidden', 'true');
    current = index;
    slides[current].classList.add('is-active');
    slides[current].removeAttribute('aria-hidden');
  }

  // One clock drives both the slide changes and the progress line, so the line always
  // reaches the right edge exactly as the next screenshot appears. Time only counts while
  // the slideshow is running: it holds still (line included) for people who asked for
  // reduced motion, while the pointer is over the screenshot, while it has keyboard focus,
  // while the full-screen view is open, and while the tab is hidden.
  var INTERVAL = 4000;
  var progress = null;
  if (slides.length > 1) {
    progress = document.createElement('div');
    progress.className = 'sd-shot__progress';
    progress.setAttribute('aria-hidden', 'true');
    stage.appendChild(progress);
  }

  var elapsed = 0;
  var last = null;
  function frame(now) {
    // Capped so a long stall (a throttled tab) cannot jump the line or skip a slide, but
    // high enough that the clock stays accurate at low frame rates.
    var step = last === null ? 0 : Math.min(now - last, 250);
    last = now;
    var holding = reduceMotion.matches || hovering || lightbox || document.hidden || stage.matches(':focus-visible');
    if (!holding) {
      elapsed += step;
      if (elapsed >= INTERVAL) {
        show((current + 1) % slides.length);
        elapsed = 0;
      }
      progress.style.transform = 'scaleX(' + elapsed / INTERVAL + ')';
    }
    window.requestAnimationFrame(frame);
  }
  if (progress) window.requestAnimationFrame(frame);

  stage.addEventListener('mouseenter', function () { hovering = true; });
  stage.addEventListener('mouseleave', function () { hovering = false; });

  function openLightbox(byKeyboard) {
    if (lightbox) return;
    var shot = slides[current];
    lightbox = document.createElement('div');
    lightbox.className = 'sd-lightbox';
    lightbox.setAttribute('role', 'dialog');
    lightbox.setAttribute('aria-modal', 'true');
    lightbox.setAttribute('aria-label', 'Screenshot');
    lightbox.dataset.byKeyboard = byKeyboard ? '1' : '';

    var image = document.createElement('img');
    image.src = shot.src;
    image.alt = shot.alt;

    var close = document.createElement('button');
    close.type = 'button';
    close.className = 'sd-lightbox__close';
    close.setAttribute('aria-label', 'Close');
    close.innerHTML = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 4l12 12M16 4 4 16"/></svg>';

    lightbox.appendChild(image);
    lightbox.appendChild(close);
    // A click anywhere closes it: on the picture, the backdrop or the X.
    lightbox.addEventListener('click', closeLightbox);
    document.body.appendChild(lightbox);
    document.documentElement.classList.add('sd-lightbox-open');
    close.focus();
  }

  function closeLightbox() {
    if (!lightbox) return;
    var byKeyboard = lightbox.dataset.byKeyboard === '1';
    lightbox.remove();
    lightbox = null;
    document.documentElement.classList.remove('sd-lightbox-open');
    if (byKeyboard) stage.focus();
  }

  stage.addEventListener('click', function () { openLightbox(false); });
  stage.addEventListener('keydown', function (event) {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      openLightbox(true);
    }
  });
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') closeLightbox();
  });
}());
</script>
<script src='https://storage.ko-fi.com/cdn/scripts/overlay-widget.js'></script>
<script>
  kofiWidgetOverlay.draw('cheshirehall', {
    'type': 'floating-chat',
    'floating-chat.donateButton.text': 'Donate',
    'floating-chat.donateButton.background-color': '#fa0',
    'floating-chat.donateButton.text-color': '#111'
  });
</script>
</body>
</html>
